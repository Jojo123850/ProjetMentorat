<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/accueil.css">
    <link rel="stylesheet" href="CSS/chat.css">
    <title>Document</title>
</head>
<body>
    <header>
        <a class="logout" href="index.html">
            Se déconnecter
        </a>
    </header>

    <main>

        <section class="profile-card">

            <div class="avatar">
                <span id="avatar-letter">G</span>
            </div>

            <h1>Mon Profil</h1>

            <div class="infos">

                <div class="info">
                    <label>Nom</label>
                    <p id="affich-nom"></p>
                </div>

                <div class="info">
                    <label>Ville</label>
                    <p id="affich-ville"></p>
                </div>

                <div class="info">
                    <label>Profession</label>
                    <p id="affich-prof"></p>
                </div>

            </div>

            <div class="actions">
                <button id="updat">Modifier mon profil</button>
                <a href="index.html">Annuler</a>
            </div>

        </section>

    </main>
    <script src="accueil.js"></script>
    <button id="chat-toggle">💬</button>

<div id="chat-box">
    <div id="chat-header">
        <span>💬</span> Tchat communauté
    </div>
    <div id="chat-messages"></div>
    <div id="chat-footer">
        <input id="chat-input" type="text" placeholder="Écris un message...">
        <button id="chat-send">➤</button>
    </div>
</div>
<script src="chat.js"></script>
</body>

</html>
