<body>
<main>
    <section id="section1">
        
            <div class="divForm">
            
                <h1>Rejoindre la communauté</h1>
            
                <p>Connectez-vous à votre environnement local et découvrez les talents qui vous entourent!</p>
                <form action="#" method="post">
                    <div>
                        <label for="nom" >Nom :</label>
                        <input type="text" name="nom" id="f-nom" placeholder="Votre nom">
                        <label for="text">Ville :</label>
                        <input id="f-adress" type="text"placeholder="Paris,....">          
                    </div>
                    <div class="form-group">
                        <label>Profession :</label>
                        <select id="f-prof">
                            <option value="">-- Choisir --</option>
                            <option>Designer UX</option>
                            <option>Développeur</option>
                            <option>Marketing</option>
                            <option>Consultant</option>
                            <option>Photographe</option>
                        </select>
                    </div>
                    <div id="btn">
                        <button type="button" id="btn-submit" onclick="">Rejoindre</button>
                        <a href="index.html">Annuler</a>
                    </div>
                </form> 
            </div>

    </section>
</main>
<script src="create.js"></script>
</body>
</html>
